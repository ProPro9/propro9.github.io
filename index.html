<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propro9</title>
    <meta name="description" content="Propro9">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #0b0c10;
            --panel: rgba(22, 24, 32, 0.4);
            --panel-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --border-highlight: rgba(255, 255, 255, 0.25);
            --text: #f0f2f6;
            --muted: #9299a8;
            --dim: #5f6674;
            --accent: #0047ab;
            --accent-bright: #1e6edb;
            --accent-soft: rgba(30, 110, 219, 0.15);
        }

        html,
        body {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            font-family: "Courier New", Courier, monospace;

            background:
                radial-gradient(circle at 76% 10%, rgba(0, 71, 171, 0.11), transparent 31%),
                radial-gradient(circle at 18% 84%, rgba(30, 110, 219, 0.06), transparent 32%),
                var(--background);
        }

        /* faint grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.008) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.46), transparent 88%);
            z-index: 0;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 180px rgba(0, 0, 0, 0.72);
        }

        /* slow background glow */
        .ambient {
            position: fixed;
            width: 520px;
            height: 520px;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(30, 110, 219, 0.15) 0%,
                rgba(0, 71, 171, 0.08) 38%,
                transparent 70%
            );
            filter: blur(35px);
            pointer-events: none;
            z-index: 0;
            animation: ambientFloat 11s ease-in-out infinite alternate;
        }

        @keyframes ambientFloat {
            from { transform: translate(-54%, -52%) scale(0.95); }
            to { transform: translate(-46%, -47%) scale(1.07); }
        }

        a, button {
            font: inherit;
        }

        /* =========================================
           LIQUID GLASS BLOBS (Background)
           ========================================= */
        .float-dot {
            position: fixed;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 1;
            animation: liquidMorph 10s infinite ease-in-out alternate, floatOrb 12s infinite ease-in-out alternate;
        }

        .float-dot.one { 
            width: 250px; height: 250px; top: 15%; left: 20%; 
            background: linear-gradient(135deg, rgba(30, 110, 219, 0.2), rgba(0, 71, 171, 0.05));
            animation-delay: 0s, 0s; 
        }
        .float-dot.two { 
            width: 180px; height: 180px; bottom: 20%; right: 15%; 
            background: linear-gradient(135deg, rgba(0, 71, 171, 0.25), rgba(30, 110, 219, 0.05));
            animation-delay: -3s, -2s; 
        }
        .float-dot.three { 
            width: 120px; height: 120px; top: 60%; left: 60%; 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
            animation-delay: -5s, -4s; 
        }

        @keyframes liquidMorph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            33% { border-radius: 58% 42% 53% 47% / 51% 45% 55% 49%; }
            66% { border-radius: 45% 55% 40% 60% / 55% 40% 60% 45%; }
            100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        }

        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(-40px) scale(1.05) rotate(15deg); }
        }

        /* buttons */
        .random-video, .sidebar-toggle {
            position: fixed;
            top: 24px;
            z-index: 20;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            color: var(--text);
            font-size: 18px;
            
            /* Liquid Glass Button Style */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-top: 1px solid var(--border-highlight);
            border-left: 1px solid var(--border-highlight);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .random-video { right: 24px; border-radius: 50%; }
        .sidebar-toggle { left: 24px; border-radius: 12px; }

        .random-video:hover, .sidebar-toggle:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border-color: var(--accent-bright);
            box-shadow: 0 10px 25px rgba(30, 110, 219, 0.3);
            transform: translateY(-2px);
        }

        .random-video:active, .sidebar-toggle:active {
            transform: translateY(1px);
        }

        /* =========================================
           LIQUID GLASS SIDEBAR
           ========================================= */
        .sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 280px;
            
            background: linear-gradient(135deg, rgba(11, 12, 16, 0.6), rgba(22, 24, 32, 0.4));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border);
            box-shadow: 20px 0 40px rgba(0,0,0,0.5);
            
            z-index: 15;
            padding: 90px 24px 24px;
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        /* Liquid edge highlight */
        .sidebar::after {
            content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
            background: linear-gradient(to bottom, transparent, var(--border-highlight), transparent);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            color: white;
            font-size: 1.4rem;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            text-shadow: 0 0 10px rgba(30, 110, 219, 0.5);
        }

        .sidebar-nav {
            display: flex; flex-direction: column; gap: 12px;
        }

        .sidebar-link {
            padding: 12px 16px;
            color: var(--text);
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            font-weight: bold;
            background: transparent;
        }

        .sidebar-link:hover {
            background: var(--accent-soft);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateX(6px);
            box-shadow: inset 0 0 15px rgba(30, 110, 219, 0.2);
        }

        /* =========================================
           LIQUID MAIN CONTENT CARD
           ========================================= */
        .main-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 80px 20px 120px 20px;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-top: 1px solid var(--border-highlight);
            border-left: 1px solid var(--border-highlight);
            border-radius: 24px;
            padding: 50px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            animation: hoverFloat 6s ease-in-out infinite alternate;
        }

        @keyframes hoverFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* Liquid surface shine sweep */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.06), transparent);
            transform: skewX(-20deg);
            animation: liquidShine 7s infinite;
            pointer-events: none;
        }

        @keyframes liquidShine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .glass-card h1 {
            color: white;
            font-size: 2.2rem;
            margin-bottom: 16px;
            text-shadow: 0 0 20px rgba(30, 110, 219, 0.4);
        }

        .glass-card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 1.1rem;
        }

        /* footer */
        .footer {
            position: fixed;
            left: 50%; bottom: 24px;
            width: min(720px, calc(100% - 40px));
            transform: translateX(-50%);
            z-index: 10; text-align: center;
        }

        .links {
            display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
        }

        .link-button {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 112px; padding: 11px 17px;
            color: var(--text); text-decoration: none;
            
            /* Liquid glass footer buttons */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 12px; font-weight: bold;
            transition: all 0.2s ease;
        }

        .link-button:hover {
            color: white;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), var(--accent-soft));
            border-color: var(--accent-bright);
            transform: translateY(-3px);
            box-shadow: 0 9px 28px rgba(0, 71, 171, 0.2), inset 0 0 15px rgba(255,255,255,0.05);
        }

        .link-button:active { transform: translateY(0); }

        .copyright { color: var(--dim); font-size: 10px; line-height: 1.65; }
        .copyright strong { color: var(--muted); font-weight: normal; }

        /* custom cursor */
        @media (pointer: fine) {
            html, body, body *, a, button, img { cursor: none !important; }
        }

        .cursor-dot {
            position: fixed; top: 0; left: 0; width: 9px; height: 9px;
            border-radius: 50%; background: #e6f0ff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 10px rgba(230, 240, 255, 0.34);
            pointer-events: none; transform: translate(-50%, -50%); opacity: 0; z-index: 9999;
            transition: opacity 0.10s ease, width 0.10s ease, height 0.10s ease, background 0.10s ease;
        }

        .cursor-dot.interactive {
            width: 14px; height: 14px; background: rgba(230, 240, 255, 0.12);
            border: 1px solid #e6f0ff; box-shadow: 0 0 11px rgba(230, 240, 255, 0.26);
        }

        .cursor-dot.pressed { width: 6px; height: 6px; }

        .cursor-glow {
            position: fixed; top: 0; left: 0; width: 350px; height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30, 110, 219, 0.14) 0%, rgba(30, 110, 219, 0.065) 32%, rgba(30, 110, 219, 0.025) 55%, transparent 72%);
            filter: blur(10px); pointer-events: none; transform: translate(-50%, -50%);
            opacity: 0; z-index: 1; transition: opacity 0.18s ease;
        }

        @media (pointer: coarse) { .cursor-dot, .cursor-glow { display: none; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

        @media (max-width: 620px) {
            .random-video { top: 16px; right: 16px; }
            .sidebar-toggle { top: 16px; left: 16px; }
            .footer { bottom: 18px; }
            .link-button { min-width: 96px; padding: 10px 13px; font-size: 11px; }
            .glass-card { padding: 30px 20px; }
            .float-dot { display: none; }
        }
    </style>
</head>

<body>
    <div class="ambient"></div>
    <div class="vignette"></div>

    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <!-- Liquid Background Blobs -->
    <div class="float-dot one"></div>
    <div class="float-dot two"></div>
    <div class="float-dot three"></div>

    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebar-toggle-btn" aria-label="Toggle Sidebar" title="Menu">
        ☰
    </button>

    <!-- Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            System Menu
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-link">Terminal</a>
            <a href="#" class="sidebar-link">Archives</a>
            <a href="#" class="sidebar-link">Settings</a>
            <a href="#" class="sidebar-link">Network</a>
        </nav>
    </aside>

    <button
        class="random-video"
        id="random-video-button"
        type="button"
        aria-label="Open a random YouTube video"
        title="Random YouTube Video">
        ▶
    </button>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="glass-card">
            <h1>Propro9</h1>
            <p>Welcome to the digital frontier. The liquid architecture adapts to its surroundings. Use the terminal menu to navigate, or engage the playback sequence above.</p>
        </div>
    </main>

    <footer class="footer">
        <div class="links">
            <a class="link-button" href="https://propro-9.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a>
            <a class="link-button" href="https://discord.gg/TgCeMFfEwG" target="_blank" rel="noopener noreferrer">Discord</a>
            <a class="link-button" href="https://www.youtube.com/@Propro_9" target="_blank" rel="noopener noreferrer">YouTube</a>
        </div>

        <div class="copyright">
            © 2026 <strong>Bowen S.</strong><br>
            All rights reserved.
        </div>
    </footer>

    <script>
        // Sidebar Toggle Logic
        const sidebarToggle = document.getElementById("sidebar-toggle-btn");
        const sidebar = document.getElementById("sidebar");

        sidebarToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            sidebar.classList.toggle("open");
        });

        document.addEventListener("click", (e) => {
            if (sidebar.classList.contains("open") && !sidebar.contains(e.target) && e.target !== sidebarToggle) {
                sidebar.classList.remove("open");
            }
        });

        // Random Video Logic
        const randomVideoButton = document.getElementById("random-video-button");
        const randomVideos = [
            "https://www.youtube.com/watch?v=jNQXAC9IVRw",
            "https://www.youtube.com/watch?v=9bZkp7q19f0",
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            "https://www.youtube.com/watch?v=GHiOrkQlIGM",
            "https://www.youtube.com/watch?v=IVYjJ5eEmuk",
            "https://www.youtube.com/watch?v=nOJd3xoKMyI",
            "https://www.youtube.com/watch?v=v3Jr9dGHbG4",
            "https://www.youtube.com/watch?v=FtutLA63Cp8",
            "https://www.youtube.com/watch?v=tVlKLpxyCBY"
        ];

        randomVideoButton.addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * randomVideos.length);
            window.open(randomVideos[randomIndex], "_blank", "noopener,noreferrer");
        });

        // Custom Cursor Logic
        const cursorDot = document.getElementById("cursor-dot");
        const cursorGlow = document.getElementById("cursor-glow");

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let glowX = mouseX;
        let glowY = mouseY;

        document.addEventListener("mousemove", event => {
            mouseX = event.clientX;
            mouseY = event.clientY;

            cursorDot.style.left = `${event.clientX}px`;
            cursorDot.style.top = `${event.clientY}px`;
            cursorDot.style.opacity = "1";
            cursorGlow.style.opacity = "1";
        });

        document.addEventListener("mouseleave", () => {
            cursorDot.style.opacity = "0";
            cursorGlow.style.opacity = "0";
        });

        function attachCursorEvents() {
            document.querySelectorAll("a, button").forEach(element => {
                element.addEventListener("mouseenter", () => {
                    cursorDot.classList.add("interactive");
                });

                element.addEventListener("mouseleave", () => {
                    cursorDot.classList.remove("interactive");
                });
            });
        }
        
        attachCursorEvents();

        document.addEventListener("mousedown", () => {
            cursorDot.classList.add("pressed");
        });

        document.addEventListener("mouseup", () => {
            cursorDot.classList.remove("pressed");
        });

        function updateCursorGlow() {
            glowX += (mouseX - glowX) * 0.12;
            glowY += (mouseY - glowY) * 0.12;

            cursorGlow.style.left = `${glowX}px`;
            cursorGlow.style.top = `${glowY}px`;

            requestAnimationFrame(updateCursorGlow);
        }

        updateCursorGlow();
    </script>
</body>
</html>
