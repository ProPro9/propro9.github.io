<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propro9</title>
    <meta name="description" content="Propro9">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --background: #0b0c10;
            --panel: rgba(22, 24, 32, .78);
            --panel-hover: rgba(27, 30, 40, .92);
            --border: #2a2e39;
            --text: #f0f2f6;
            --muted: #9299a8;
            --dim: #5f6674;
            --accent-bright: #1e6edb;
            --accent-soft: rgba(0, 71, 171, .14);
        }

        html, body {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
            font-family: "Courier New", Courier, monospace;
            background:
                radial-gradient(circle at 76% 10%, rgba(0, 71, 171, .11), transparent 31%),
                radial-gradient(circle at 18% 84%, rgba(30, 110, 219, .06), transparent 32%),
                var(--background);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.008) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.46), transparent 88%);
            z-index: 0;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 180px rgba(0,0,0,.72);
        }

        .ambient {
            position: fixed;
            width: 520px;
            height: 520px;
            left: 50%;
            top: 45%;
            transform: translate(-50%,-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30,110,219,.10), rgba(0,71,171,.05) 38%, transparent 70%);
            filter: blur(26px);
            pointer-events: none;
            z-index: 0;
            animation: ambientFloat 11s ease-in-out infinite alternate;
        }

        @keyframes ambientFloat {
            from { transform: translate(-54%,-52%) scale(.95); }
            to { transform: translate(-46%,-47%) scale(1.07); }
        }

        a, button {
            font: inherit;
        }

        .random-video {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10;
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            color: var(--muted);
            background: rgba(22,24,32,.72);
            border: 1px solid var(--border);
            border-radius: 50%;
            font-size: 17px;
            backdrop-filter: blur(14px);
            cursor: pointer;
            transition: all .18s ease;
        }

        .random-video:hover {
            color: white;
            background: var(--panel-hover);
            border-color: var(--accent-bright);
            transform: translateY(-2px) rotate(5deg);
            box-shadow: 0 10px 28px rgba(0,71,171,.15);
        }

        .random-video:active {
            transform: translateY(0);
        }

        .footer {
            position: fixed;
            left: 50%;
            bottom: 24px;
            width: min(720px, calc(100% - 40px));
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-width: 112px;
            padding: 11px 17px;
            color: var(--text);
            text-decoration: none;
            background:
                linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
                var(--panel);
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(14px);
            transition: all .18s ease;
        }

        .link-button:hover {
            color: white;
            background:
                linear-gradient(180deg,rgba(255,255,255,.03),transparent),
                var(--accent-soft);
            border-color: var(--accent-bright);
            transform: translateY(-3px);
            box-shadow:
                0 9px 28px rgba(0,71,171,.14),
                inset 0 0 22px rgba(30,110,219,.035);
        }

        .link-button img {
            width: 17px;
            height: 17px;
            object-fit: contain;
            filter: invert(1);
            opacity: .82;
            transition: opacity .18s ease;
        }

        .link-button:hover img {
            opacity: 1;
        }

        .patreon img {
            width: 18px;
            height: 18px;
        }

        .discord img {
            width: 18px;
            height: 18px;
        }

        .youtube img {
            width: 19px;
            height: 19px;
        }

        .itch img {
            width: 18px;
            height: 18px;
        }

        .copyright {
            color: var(--dim);
            font-size: 10px;
            line-height: 1.65;
        }

        .copyright strong {
            color: var(--muted);
            font-weight: normal;
        }

        @media (pointer:fine) {
            html, body, body *, a, button, img {
                cursor: none !important;
            }
        }

        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 9px;
            height: 9px;
