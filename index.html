<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propro9</title>
    <meta name="description" content="Propro9">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #0b0c10;
            --text: #f0f2f6;
            --muted: #9299a8;
            --dim: #5f6674;
            --accent-bright: #1e6edb;
        }

        html,
        body {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
            font-family: "Courier New", Courier, monospace;

            background:
                radial-gradient(circle at 76% 10%, rgba(0, 71, 171, 0.15), transparent 31%),
                radial-gradient(circle at 18% 84%, rgba(30, 110, 219, 0.1), transparent 32%),
                var(--background);
        }

        /* faint grid - crucial for making the glass refraction visible */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent 95%);
            z-index: 0;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.85);
        }

        /* slow background glow */
        .ambient {
            position: fixed;
            width: 600px;
            height: 600px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(30, 110, 219, 0.12) 0%,
                rgba(0, 71, 171, 0.05) 40%,
                transparent 70%
            );
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
            animation: ambientFloat 15s ease-in-out infinite alternate;
        }

        @keyframes ambientFloat {
            from { transform: translate(-55%, -55%) scale(0.9); }
            to { transform: translate(-45%, -45%) scale(1.1); }
        }

        a, button {
            font: inherit;
        }

        /* =========================================
           LIQUID GLASS EFFECT UTILITY
           ========================================= */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(18px) saturate(120%);
            -webkit-backdrop-filter: blur(18px) saturate(120%);
            
            /* The realistic lighting edges */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1.5px solid rgba(255, 255, 255, 0.4);
            border-left: 1.5px solid rgba(255, 255, 255, 0.25);
            border-bottom: 1px solid rgba(0, 0, 0, 0.5);
            border-right: 1px solid rgba(0, 0, 0, 0.5);
            
            /* Inner refraction and outer shadow */
            box-shadow:
                inset 2px 2px 6px rgba(255, 255, 255, 0.15),
                inset -3px -3px 8px rgba(0, 0, 0, 0.4),
                0 25px 40px rgba(0, 0, 0, 0.6);
        }

        /* buttons */
        .random-video, .sidebar-toggle {
            position: fixed;
            top: 30px;
            z-index: 20;
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            border-radius: 50%; /* Perfect circles like water drops */
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .random-video { right: 30px; }
        .sidebar-toggle { left: 30px; }

        .random-video:hover, .sidebar-toggle:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            box-shadow:
                inset 2px 2px 6px rgba(255, 255, 255, 0.3),
                inset -3px -3px 8px rgba(0, 0, 0, 0.5),
                0 15px 30px rgba(30, 110, 219, 0.3);
            transform: translateY(-2px);
        }

        .random-video:active, .sidebar-toggle:active {
            transform: translateY(2px);
        }

        /* =========================================
           SIDEBAR (Floating Liquid Pill)
           ========================================= */
        .sidebar {
            position: fixed;
            top: 100px; 
            left: 30px; 
            width: 260px;
            border-radius: 30px;
            z-index: 15;
            padding: 30px 20px;
            
            /* Hidden state */
            transform: translateX(-150%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar.open {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-nav {
            display: flex; 
            flex-direction: column; 
            gap: 16px;
        }

        /* Inner buttons inside sidebar */
        .liquid-button {
            padding: 16px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.01);
            
            /* Indented / subtle liquid look */
            border: 1px solid transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(0, 0, 0, 0.3);
            box-shadow: 
                inset 1px 1px 3px rgba(255, 255, 255, 0.1),
                0 4px 10px rgba(0, 0, 0, 0.2);
            
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .liquid-button:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                inset 2px 2px 5px rgba(255, 255, 255, 0.2),
                0 8px 15px rgba(30, 110, 219, 0.2);
            transform: translateY(-2px);
        }

        .liquid-button:active {
            transform: translateY(1px);
        }

        /* footer */
        .footer {
            position: fixed;
            left: 50%; bottom: 24px;
            width: min(720px, calc(100% - 40px));
            transform: translateX(-50%);
            z-index: 10; text-align: center;
        }

        .links {
            display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
        }

        .link-button {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 100px; padding: 12px 20px;
            color: var(--muted); text-decoration: none;
            border-radius: 20px;
            font-size: 12px; font-weight: bold;
            transition: all 0.3s ease;
        }

        .link-button:hover {
            color: white;
            transform: translateY(-3px);
        }

        .copyright { color: var(--dim); font-size: 10px; line-height: 1.65; }
        .copyright strong { color: var(--muted); font-weight: normal; }

        /* custom cursor */
        @media (pointer: fine) {
            html, body, body *, a, button, img { cursor: none !important; }
        }

        .cursor-dot {
            position: fixed; top: 0; left: 0; width: 9px; height: 9px;
            border-radius: 50%; background: #e6f0ff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 10px rgba(230, 240, 255, 0.34);
            pointer-events: none; transform: translate(-50%, -50%); opacity: 0; z-index: 9999;
            transition: opacity 0.10s ease, width 0.10s ease, height 0.10s ease, background 0.10s ease;
        }

        .cursor-dot.interactive {
            width: 14px; height: 14px; background: rgba(230, 240, 255, 0.12);
            border: 1px solid #e6f0ff; box-shadow: 0 0 11px rgba(230, 240, 255, 0.26);
        }

        .cursor-dot.pressed { width: 6px; height: 6px; }

        .cursor-glow {
            position: fixed; top: 0; left: 0; width: 350px; height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30, 110, 219, 0.14) 0%, rgba(30, 110, 219, 0.065) 32%, rgba(30, 110, 219, 0.025) 55%, transparent 72%);
            filter: blur(10px); pointer-events: none; transform: translate(-50%, -50%);
            opacity: 0; z-index: 1; transition: opacity 0.18s ease;
        }

        @media (pointer: coarse) { .cursor-dot, .cursor-glow { display: none; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
    </style>
</head>

<body>
    <div class="ambient"></div>
    <div class="vignette"></div>

    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle liquid-glass" id="sidebar-toggle-btn" aria-label="Toggle Sidebar" title="Menu">
        ☰
    </button>

    <!-- Navigation Sidebar -->
    <aside class="sidebar liquid-glass" id="sidebar">
        <nav class="sidebar-nav">
            <button class="liquid-button">Placeholder 1</button>
            <button class="liquid-button">Placeholder 2</button>
            <button class="liquid-button">Placeholder 3</button>
        </nav>
    </aside>

    <button
        class="random-video liquid-glass"
        id="random-video-button"
        type="button"
        aria-label="Open a random YouTube video"
        title="Random YouTube Video">
        ▶
    </button>

    <footer class="footer">
        <div class="links">
            <a class="link-button liquid-glass" href="https://propro-9.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a>
            <a class="link-button liquid-glass" href="https://discord.gg/TgCeMFfEwG" target="_blank" rel="noopener noreferrer">Discord</a>
            <a class="link-button liquid-glass" href="https://www.youtube.com/@Propro_9" target="_blank" rel="noopener noreferrer">YouTube</a>
        </div>

        <div class="copyright">
            © 2026 <strong>Bowen S.</strong><br>
            All rights reserved.
        </div>
    </footer>

    <script>
        // Sidebar Toggle Logic
        const sidebarToggle = document.getElementById("sidebar-toggle-btn");
        const sidebar = document.getElementById("sidebar");

        sidebarToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            sidebar.classList.toggle("open");
        });

        document.addEventListener("click", (e) => {
            if (sidebar.classList.contains("open") && !sidebar.contains(e.target) && e.target !== sidebarToggle) {
                sidebar.classList.remove("open");
            }
        });

        // Random Video Logic
        const randomVideoButton = document.getElementById("random-video-button");
        const randomVideos = [
            "https://www.youtube.com/watch?v=jNQXAC9IVRw",
            "https://www.youtube.com/watch?v=9bZkp7q19f0",
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            "https://www.youtube.com/watch?v=GHiOrkQlIGM",
            "https://www.youtube.com/watch?v=IVYjJ5eEmuk",
            "https://www.youtube.com/watch?v=nOJd3xoKMyI",
            "https://www.youtube.com/watch?v=v3Jr9dGHbG4",
            "https://www.youtube.com/watch?v=FtutLA63Cp8",
            "https://www.youtube.com/watch?v=tVlKLpxyCBY"
        ];

        randomVideoButton.addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * randomVideos.length);
            window.open(randomVideos[randomIndex], "_blank", "noopener,noreferrer");
        });

        // Custom Cursor Logic
        const cursorDot = document.getElementById("cursor-dot");
        const cursorGlow = document.getElementById("cursor-glow");

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let glowX = mouseX;
        let glowY = mouseY;

        document.addEventListener("mousemove", event => {
            mouseX = event.clientX;
            mouseY = event.clientY;

            cursorDot.style.left = `${event.clientX}px`;
            cursorDot.style.top = `${event.clientY}px`;
            cursorDot.style.opacity = "1";
            cursorGlow.style.opacity = "1";
        });

        document.addEventListener("mouseleave", () => {
            cursorDot.style.opacity = "0";
            cursorGlow.style.opacity = "0";
        });

        function attachCursorEvents() {
            document.querySelectorAll("a, button").forEach(element => {
                element.addEventListener("mouseenter", () => {
                    cursorDot.classList.add("interactive");
                });

                element.addEventListener("mouseleave", () => {
                    cursorDot.classList.remove("interactive");
                });
            });
        }
        
        attachCursorEvents();

        document.addEventListener("mousedown", () => {
            cursorDot.classList.add("pressed");
        });

        document.addEventListener("mouseup", () => {
            cursorDot.classList.remove("pressed");
        });

        function updateCursorGlow() {
            glowX += (mouseX - glowX) * 0.12;
            glowY += (mouseY - glowY) * 0.12;

            cursorGlow.style.left = `${glowX}px`;
            cursorGlow.style.top = `${glowY}px`;

            requestAnimationFrame(updateCursorGlow);
        }

        updateCursorGlow();
    </script>
</body>
</html>
