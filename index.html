<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propro9</title>
    <meta name="description" content="Github Pages Site Thingy">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- FontAwesome 6 for Social & Platform Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --background: #000000;
            --panel: rgba(18, 18, 20, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --accent-glow: rgba(30, 110, 219, 0.25);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            user-select: none;
        }

        /* Video Background */
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.65) contrast(1.05);
        }

        /* Overlay vignette */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
            z-index: -1;
        }

        /* Top Action Buttons */
        .top-left { position: fixed; top: 24px; left: 24px; z-index: 10; }
        .top-right { position: fixed; top: 24px; right: 24px; z-index: 10; }

        .icon-button {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            color: #d0d0d0;
            background: rgba(20, 20, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            font-size: 16px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-button:hover {
            color: #fff;
            background: rgba(40, 40, 50, 0.8);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Main Bio Card */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        .card {
            width: min(520px, 92vw);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 32px 28px 24px 28px;
            backdrop-filter: blur(24px) saturate(140%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Avatar Section */
        .avatar-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin-bottom: 14px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #121214;
            background: #747f8d; /* default offline */
        }

        .status-dot.online { background: #23a55a; }
        .status-dot.idle { background: #f0b232; }
        .status-dot.dnd { background: #f23f43; }

        .username {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #d0d0d0;
            margin-bottom: 20px;
        }

        /* Lanyard Status Box */
        .lanyard-box {
            width: 100%;
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            text-align: left;
        }

        .lanyard-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .lanyard-details {
            flex: 1;
            overflow: hidden;
        }

        .lanyard-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .blend-badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 6px;
            border-radius: 8px;
            color: #bbb;
            font-weight: normal;
        }

        .lanyard-sub {
            font-size: 12px;
            color: #8e9297;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .lanyard-sub strong { color: #dcddde; }

        .lanyard-art {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Glowing Social Row */
        .social-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .social-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .social-icon img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Specific Glow Colors */
        .social-icon.discord { color: #5865F2; }
        .social-icon.discord:hover { background: #5865F2; color: #fff; box-shadow: 0 0 18px #5865F2; }

        .social-icon.youtube { color: #FF0000; }
        .social-icon.youtube:hover { background: #FF0000; color: #fff; box-shadow: 0 0 18px #FF0000; }

        .social-icon.spotify { color: #1DB954; }
        .social-icon.spotify:hover { background: #1DB954; color: #fff; box-shadow: 0 0 18px #1DB954; }

        .social-icon.twitch { color: #9146FF; }
        .social-icon.twitch:hover { background: #9146FF; color: #fff; box-shadow: 0 0 18px #9146FF; }

        .social-icon.patreon { color: #FF424D; }
        .social-icon.patreon:hover { background: #FF424D; color: #fff; box-shadow: 0 0 18px #FF424D; }

        .social-icon.saul:hover { background: #e09f3e; box-shadow: 0 0 18px #e09f3e; }

        .social-icon.steam { color: #1b2838; }
        .social-icon.steam i { color: #66c0f4; }
        .social-icon.steam:hover { background: #66c0f4; color: #1b2838; box-shadow: 0 0 18px #66c0f4; }
        .social-icon.steam:hover i { color: #1b2838; }

        .social-icon.xbox { color: #107C41; }
        .social-icon.xbox:hover { background: #107C41; color: #fff; box-shadow: 0 0 18px #107C41; }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            width: 100%;
            justify-content: flex-start;
        }

        /* Custom Cursor Fix */
        @media (pointer: fine) {
            * { cursor: none !important; }
        }

        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: opacity 0.15s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .cursor-trail {
            position: fixed;
            top: 0;
            left: 0;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out;
        }
    </style>
</head>
<body>

    <!-- Video Background Stream -->
    <video class="bg-video" id="bg-video" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>
    <div class="vignette"></div>

    <!-- Custom Cursor Elements -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-trail" id="cursor-trail"></div>

    <!-- Controls Header -->
    <div class="top-left">
        <button class="icon-button" id="audio-toggle" title="Toggle Audio"><i class="fa-solid fa-volume-xmark"></i></button>
    </div>
    <div class="top-right">
        <button class="icon-button" id="random-video" title="Random Video">▶</button>
    </div>

    <!-- Center Card -->
    <div class="container">
        <div class="card">
            
            <div class="avatar-wrapper">
                <img src="https://i.ibb.co/L8G2Q5N/chopper.png" id="avatar-img" class="avatar-img" alt="Propro9 Avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <div class="status-dot" id="status-dot"></div>
            </div>

            <h1 class="username">propro9</h1>
            <p class="tagline">A person that is cool (i think)</p>

            <div class="location-badge">
                <i class="fa-solid fa-location-dot"></i> Earth
            </div>

            <!-- Discord Presence Box -->
            <div class="lanyard-box" id="lanyard-box">
                <img src="https://i.ibb.co/L8G2Q5N/chopper.png" class="lanyard-avatar" id="lanyard-avatar">
                <div class="lanyard-details">
                    <div class="lanyard-header">
                        <span id="lanyard-username">propro_9</span>
                        <span class="blend-badge">✦ blend</span>
                    </div>
                    <div class="lanyard-sub" id="lanyard-activity">Loading presence...</div>
                </div>
                <img src="" class="lanyard-art" id="lanyard-art" style="display:none;">
            </div>

            <!-- Glowing Social Icons Row -->
            <div class="social-row">
                <a href="https://discord.gg/hFQuDNbjhQ" target="_blank" class="social-icon discord" title="Discord"><i class="fa-brands fa-discord"></i></a>
                <a href="https://www.youtube.com/@Propro_9" target="_blank" class="social-icon youtube" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://open.spotify.com/user/31q7iqf6bscn5dklry5r4c2eedsi?si=dbb7fad9afde4013" target="_blank" class="social-icon spotify" title="Spotify"><i class="fa-brands fa-spotify"></i></a>
                <a href="https://www.twitch.tv/propro_9" target="_blank" class="social-icon twitch" title="Twitch"><i class="fa-brands fa-twitch"></i></a>
                <a href="https://www.patreon.com/cw/propro9" target="_blank" class="social-icon patreon" title="Patreon"><i class="fa-brands fa-patreon"></i></a>
                <a href="https://propro-9.itch.io/" target="_blank" class="social-icon saul" title="Itch.io"><img src="https://i.imgur.com/8Q9Z5b3.png" alt="Saul" onerror="this.src='https://cdn.discordapp.com/embed/avatars/1.png'"></a>
                <a href="https://steamcommunity.com/profiles/76561198770152072/" target="_blank" class="social-icon steam" title="Steam"><i class="fa-brands fa-steam"></i></a>
                <a href="https://www.xbox.com/en-US/play/user/propro0909" target="_blank" class="social-icon xbox" title="Xbox"><i class="fa-brands fa-xbox"></i></a>
            </div>

            <div class="card-footer">
                <i class="fa-solid fa-eye"></i> <span id="views-count">0</span>
            </div>

        </div>
    </div>

    <script>
        // DISCORD USER ID
        const DISCORD_ID = "1223079178677780492";

        // Video Audio Toggle
        const bgVideo = document.getElementById('bg-video');
        const audioBtn = document.getElementById('audio-toggle');
        
        audioBtn.addEventListener('click', () => {
            bgVideo.muted = !bgVideo.muted;
            audioBtn.innerHTML = bgVideo.muted 
                ? '<i class="fa-solid fa-volume-xmark"></i>' 
                : '<i class="fa-solid fa-volume-high"></i>';
        });

        // Random Video Switcher
        const randomVideos = [
            "https://www.youtube.com/watch?v=NUJ4T21DlAQ",
            "https://www.youtube.com/watch?v=jNQXAC9IVRw",
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        ];
        document.getElementById('random-video').addEventListener('click', () => {
            window.open(randomVideos[Math.floor(Math.random() * randomVideos.length)], '_blank');
        });

        // Fixed Custom Cursor Logic
        const cursorDot = document.getElementById('cursor-dot');
        const cursorTrail = document.getElementById('cursor-trail');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let trailX = mouseX;
        let trailY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = `${mouseX}px`;
            cursorDot.style.top = `${mouseY}px`;
        });

        function animateCursor() {
            trailX += (mouseX - trailX) * 0.2;
            trailY += (mouseY - trailY) * 0.2;
            cursorTrail.style.left = `${trailX}px`;
            cursorTrail.style.top = `${trailY}px`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Fetch Discord Presence via Lanyard API
        async function fetchLanyard() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const { data } = await res.json();
                if (!data) return;

                // Status Dot
                const statusDot = document.getElementById('status-dot');
                statusDot.className = `status-dot ${data.discord_status}`;

                // Avatar
                if (data.discord_user.avatar) {
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.png?size=256`;
                    document.getElementById('avatar-img').src = avatarUrl;
                    document.getElementById('lanyard-avatar').src = avatarUrl;
                }

                // Spotify or Game Activity
                const activityElem = document.getElementById('lanyard-activity');
                const artElem = document.getElementById('lanyard-art');

                if (data.listening_to_spotify) {
                    activityElem.innerHTML = `Listening to <strong>${data.spotify.song}</strong> by ${data.spotify.artist}`;
                    artElem.src = data.spotify.album_art_url;
                    artElem.style.display = 'block';
                } else if (data.activities && data.activities.length > 0) {
                    const game = data.activities.find(a => a.type === 0);
                    if (game) {
                        activityElem.innerHTML = `Playing <strong>${game.name}</strong>`;
                        artElem.style.display = 'none';
                    } else {
                        activityElem.innerHTML = `Offline / Chilling`;
                        artElem.style.display = 'none';
                    }
                } else {
                    activityElem.innerHTML = `Offline / Chilling`;
                    artElem.style.display = 'none';
                }
            } catch (err) {
                console.error("Lanyard error:", err);
            }
        }

        fetchLanyard();
        setInterval(fetchLanyard, 10000); // refresh every 10s
    </script>
</body>
</html>
